# Impact Intelligence standalone domain — nginx config
# Domain: zimlearngraph.duckdns.org
#
# The root / redirects to /impact so the standalone domain opens Impact Intelligence.
# All other paths proxy through to the same Next.js frontend on port 3003.
# API proxied to the same FastAPI backend on port 5055.
#
# Installation:
#   sudo ln -sf /root/vault-open-notebook/deploy/nginx/impact-standalone.conf /etc/nginx/sites-available/zimlearngraph
#   sudo ln -sf /etc/nginx/sites-available/zimlearngraph /etc/nginx/sites-enabled/zimlearngraph
#   sudo certbot --nginx -d zimlearngraph.duckdns.org
#   sudo nginx -s reload
#
# Rollback (remove this domain):
#   sudo rm /etc/nginx/sites-enabled/zimlearngraph /etc/nginx/sites-available/zimlearngraph
#   sudo nginx -s reload

server {
    listen 80;
    server_name zimlearngraph.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name zimlearngraph.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/zimlearngraph.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zimlearngraph.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # API → same FastAPI backend (port 5055)
    location /api/ {
        proxy_pass http://127.0.0.1:5055/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Root path → redirect to /impact so standalone domain opens Impact Intelligence
    location = / {
        return 302 /impact-intelligence;
    }

    # Static assets (hashed, content-addressed) — keep immutable. Deliberately
    # excluded from the document cache-bust headers below. Long immutable
    # caching is correct for hashed /_next/static files.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pass through Next.js immutable Cache-Control for hashed static assets.
    }

    # Everything else (HTML documents + app routes) → Next.js frontend (port 3003)
    # Impact routes under /impact/*, normal app routes.
    # No path rewriting needed — Next.js handles its own routing.
    #
    # TEMPORARY CACHE PURGE (added 2026-07-11): the previous broken deploy left
    # some browsers holding a poisoned immutable copy of an old chunk
    # (07vbqatnaegte.js). Documents are served no-store + must-revalidate and a
    # Clear-Site-Data: "cache" header is sent so those browsers evict the
    # poisoned cache and fetch the current build.
    # REMOVE the three lines marked TEMPORARY below after 2026-07-13 once old
    # clients have refreshed. /_next/static/ stays immutable (block above).
    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # TEMPORARY (remove after 2026-07-13): purge poisoned browser caches.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header Clear-Site-Data "\"cache\"" always;
    }
}
