# HiveMind Intelligence standalone domain — nginx config
# Domain: hivemind.duckdns.org
#
# Rebranded from zimlearngraph.duckdns.org. Root / -> /impact-intelligence.
# Frontend :3003, API :5055.
#
# Installation:
#   sudo ln -sf /root/vault-open-notebook/deploy/nginx/impact-standalone.conf /etc/nginx/sites-available/hivemind
#   sudo ln -sf /etc/nginx/sites-available/hivemind /etc/nginx/sites-enabled/hivemind
#   sudo certbot --nginx -d hivemind.duckdns.org
#   sudo nginx -s reload
#
# CERTLESS MODE (until DNS is live + cert issued): the HTTPS server block is
# commented out below; HTTP serves the app directly. After certbot runs, edit
# this file to enable the 443 server (uncomment) and switch the 80 server to
# redirect to https. The live /etc/nginx/sites-available/hivemind already holds
# both the certless and TLS versions.

server {
    listen 80;
    server_name hivemind.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /api/owner-access {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5055/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = / {
        return 302 /impact-intelligence;
    }

    location ^~ /_next/static/ {
        alias /var/www/hivemind-static/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

