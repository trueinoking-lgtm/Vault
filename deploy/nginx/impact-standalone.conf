# Impact Intelligence standalone domain — nginx config
# 
# Place this file at /etc/nginx/sites-enabled/impact-intelligence
# Then run: sudo nginx -s reload
#
# This doesn't require a separate process — it reuses the existing
# Vault frontend on port 3003.

server {
    listen 80;
    server_name zimlearngraph-impact.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name zimlearngraph-impact.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/zimlearngraph-impact.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zimlearngraph-impact.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # API → same FastAPI backend
    location /api/ {
        proxy_pass http://127.0.0.1:5055/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Impact Intelligence: rewrite / → /impact
    location / {
        rewrite ^/(.*)$ /impact/$1 break;
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host vault-lms.duckdns.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
